services:
  web:
    image: curtisasral/homepage:latest
    container_name: curtis-homepage
    environment:
      CHECKLIST_PASSWORD: "${CHECKLIST_PASSWORD:?Set CHECKLIST_PASSWORD in .env}"
      CHECKLIST_COOKIE_SECRET: "${CHECKLIST_COOKIE_SECRET:?Set CHECKLIST_COOKIE_SECRET in .env}"
      CHECKLIST_COOKIE_SECURE: "true"
    networks:
      - appnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    env_file:
      - .env
    command:
      - tunnel
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
      - --url
      - http://curtis-homepage:5000
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
